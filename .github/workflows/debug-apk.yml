name: Fork APK

on:
  push:
    branches: [release-on-app]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Release build (R8, no debuggable runtime) so Compose runs at full speed.
      # Signed with fork-debug.keystore, a deliberately non-secret key kept in the
      # repo, so every build installs over the previous one.
      - name: Write signing config
        run: |
          cat > keystore.properties <<EOF
          storeFile=fork-debug.keystore
          storePassword=android
          keyAlias=androiddebugkey
          keyPassword=android
          EOF

      - name: Assemble release APK
        run: ./gradlew assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: victoria-launcher-fork
          path: app/build/outputs/apk/release/*.apk
