name: Fork APK

on:
  push:
    branches: [release-on-app]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Release build (R8, no debuggable runtime) so Compose runs at full speed.
      # Signed with fork-debug.keystore, a deliberately non-secret key kept in the
      # repo, so every build installs over the previous one.
      # Same checks the upstream CI runs on every pull request.
      - name: Unit tests
        run: ./gradlew test

      - name: Lint
        run: ./gradlew lint

      - name: Write signing config
        run: |
          cat > keystore.properties <<EOF
          storeFile=fork-debug.keystore
          storePassword=android
          keyAlias=androiddebugkey
          keyPassword=android
          EOF

      - name: Assemble release APK
        run: ./gradlew assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: victoria-launcher-fork
          path: app/build/outputs/apk/release/*.apk

      # The GitHub app does not show workflow artifacts, so the APK also goes to a release
      # that is replaced on every build: one fixed place to download it from, app or browser.
      - name: Publish to the fork-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk victoria-launcher-fork.apk
          notes="Build of ${GITHUB_SHA::7} from ${GITHUB_REF_NAME}"
          if gh release view fork-latest >/dev/null 2>&1; then
            gh release upload fork-latest victoria-launcher-fork.apk --clobber
            gh release edit fork-latest --notes "$notes" --target "$GITHUB_SHA"
          else
            gh release create fork-latest victoria-launcher-fork.apk \
              --title "Fork build (latest)" --notes "$notes" --target "$GITHUB_SHA" --prerelease
          fi
