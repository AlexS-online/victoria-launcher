name: CI check

on:
  push:
    branches: [ci/sort-by-colour]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Release build (R8, no debuggable runtime) so Compose runs at full speed.
      # Signed with fork-debug.keystore, a deliberately non-secret key kept in the
      # repo, so every build installs over the previous one.
      # Same checks the upstream CI runs on every pull request.
      - name: Unit tests
        run: ./gradlew test

      - name: Lint
        run: ./gradlew lint

      - name: Assemble debug APK
        run: ./gradlew assembleDebug

